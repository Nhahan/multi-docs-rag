goal: "Build a local multi-document RAG MVP in this repository with citation-grounded answers."
constraints:
  - "Use existing Next.js/TypeScript stack"
  - "Use Ollama local models only"
  - "Support ingestion and retrieval for local PDF corpora"
  - "No external cloud LLM APIs"
acceptance_criteria:
  - "Ingestion parses local PDFs and stores chunk metadata including source_file, document_id, page, chunk_id, and section_title."
  - "Query API returns deterministic page-based citations in [document-id p.<page>] format."
  - "Questions requiring evidence from one or more uploaded documents can be answered from retrieved chunks."
  - "Smoke test scripts run against fixture corpora and validate citation-grounded answers."
ontology_schema:
  name: "MultiDocsRAG"
  description: "Local citation-grounded multi-document retrieval-augmented generation"
  fields:
    - name: "evidence_availability"
      field_type: "object"
      description: "Availability summary for retrieved evidence"
    - name: "citations"
      field_type: "array"
      description: "Evidence citation tags from source docs"
metadata:
  seed_id: "multidocs-rag-001"
  ambiguity_score: 0.12
